# Lint config (`python -m ruff check .`). Kept out of pyproject.toml on purpose: Vercel's Python
# builder installs dependencies from pyproject.toml whenever one exists, instead of requirements.txt.
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "venv"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports/variables, undefined names
    "I",    # import order
    "UP",   # modern syntax for Python 3.12
    "B",    # bugbear: likely bugs
    "SIM",  # simplifications
]
ignore = [
    "B008",  # FastAPI's Depends()/Query() defaults are the intended pattern
]

[lint.per-file-ignores]
# conftest sets env vars before importing the app; app.py mounts routers after creating it
"tests/conftest.py" = ["E402"]
"rest_api/app.py" = ["E402"]
"rest_api/database/config.py" = ["E402"]

[lint.isort]
known-first-party = ["rest_api"]
known-third-party = ["alembic"]
known-local-folder = ["helpers", "conftest"]
