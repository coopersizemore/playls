name: Backend

# Lint and test the FastAPI backend on every push to main.
# The tests are hermetic (SQLite + a fake Spotify, see back-end/tests/conftest.py),
# so no secrets, database or network access are needed.
on:
  push:
    branches: [main]
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: read

# A newer push to main cancels the run for an older one
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: back-end

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: back-end/.python-version
          cache: pip
          cache-dependency-path: |
            back-end/requirements.txt
            back-end/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Rules live in back-end/ruff.toml; GitHub output format annotates the diff
      - name: Ruff
        run: python -m ruff check . --output-format github

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: back-end/.python-version
          cache: pip
          cache-dependency-path: |
            back-end/requirements.txt
            back-end/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest -q
