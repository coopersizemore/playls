name: Frontend

# Build the React app on every push to main. `react-scripts build` also runs ESLint, and
# with CI=true (set by GitHub Actions) lint warnings fail the build.
# There are no frontend unit tests yet, so the build is the check.
on:
  push:
    branches: [main]
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: read

# A newer push to main cancels the run for an older one
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: playls_front_end

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playls_front_end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: true
